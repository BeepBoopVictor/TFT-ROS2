dataset:
  root_dir: "/root/tfg_panda_ws/datasets/fp3_pick_place_v6_act_quality"
  sample_hz: 5.0
  image_format: "png"

gazebo:
  world_name: "fp3_pick_place_world"
  red_cube_entity: "red_cube"
  blue_cube_entity: "blue_cube"
  hidden_xyz: [2.0, 2.0, 0.50]
  settle_after_reset_sec: 1.5

camera:
  rgb_topic: "/camera_cabinet/image"
  camera_name: "camera_cabinet"
  cameras:
    cabinet:
      rgb_topic: "/camera_cabinet/image"
      camera_name: "camera_cabinet"
    top:
      rgb_topic: "/camera_top_conveyor/image"
      camera_name: "camera_top_conveyor"

robot:
  planning_frame: "world"
  tcp_frame: "fp3_hand_tcp"
  arm_joints:
    - fp3_joint1
    - fp3_joint2
    - fp3_joint3
    - fp3_joint4
    - fp3_joint5
    - fp3_joint6
    - fp3_joint7
  gripper_joints:
    - fp3_finger_joint1
    - fp3_finger_joint2
  grasp_down_quat:
    qx: 1.0
    qy: 0.0
    qz: 0.0
    qw: 0.0

gripper:
  open_width: 0.039
  grasp_width: 0.010
  safe_min_width: 0.003
  command_duration: 2.4
  position_tolerance: 0.004

scene:
  conveyor_length: 2.80
  red_cube:
    color: "red"
    default_pick_xyz: [0.40, 0.18, 0.23]
    goal_xyz: [0.05, 0.55, 0.23]
  blue_cube:
    color: "blue"
    default_pick_xyz: [0.40, -0.18, 0.23]
    goal_xyz: [0.05, -0.55, 0.23]

randomization:
  enabled: true
  # V6: rango intencionadamente moderado para ACT. Primero robustez, luego ampliar.
  conveyor_spawn:
    x_min: 0.34
    x_max: 0.48
    y_min: 0.12
    y_max: 0.22
    z: 0.24
  probability_two_cubes: 0.15
  min_cube_distance_xy: 0.26

motion:
  # Alturas amplias y reproducibles para que el experto deje datos limpios.
  pregrasp_z: 0.43
  lift_z: 0.52
  preplace_z: 0.43
  retreat_z: 0.52
  settle_after_motion_sec: 0.8
  settle_after_gripper_sec: 1.2
  move_retries: 2
  move_timeout_sec: 120.0

validation:
  enabled: true
  require_pose_query: true
  goal_area:
    enabled: true
    red:
      center_xyz: [0.05, 0.55, 0.23]
      size_xy: [0.36, 0.36]
    blue:
      center_xyz: [0.05, -0.55, 0.23]
      size_xy: [0.36, 0.36]
    margin_xy: 0.04
  goal_tolerance_xy: 0.25
  goal_tolerance_z: 0.25

recording:
  keep_failed_episodes: true

# Se deja clean_motion por compatibilidad, pero V6 usa --moveit-tcp.
clean_motion:
  reference_x: 0.40
  joint1_gain: 1.0
  joint1_offset: 0.0
  gripper_yaw: 0.0
  settle_after_initial_open: 0.8
  reach_q2_gain: -0.45
  reach_q4_gain: -0.35
  reach_q6_gain: 0.30
  lateral_q3_gain: 0.08
  lateral_q5_gain: 0.06
  advance:
    q2_delta: -0.12
    q4_delta: -0.20
    q6_delta: 0.16
  descend:
    q2_delta: -0.32
    q4_delta: -0.58
    q6_delta: 0.48
  lift:
    q2_delta: -0.08
    q4_delta: -0.14
    q6_delta: 0.18
  durations:
    face: 1.5
    slide: 2.5
    down: 2.2
    gripper: 1.8

moveit_tcp_motion:
  # V6: experto lento y con muchos frames para ACT a 5 Hz.
  stream_min_dt: 0.05
  stream_max_dt: 0.20

  settle_after_segment: 1.0
  hold_after_segment: 1.8
  fresh_state_wait_after_segment: 1.0
  settle_after_gripper: 1.4

  arm_stable_time: 0.9
  arm_stable_timeout: 4.5
  arm_stable_time_after_gripper: 0.8
  arm_stable_timeout_after_gripper: 3.5
  arm_stable_velocity_tol: 0.010
  arm_stable_position_tol: 0.0020

  trim_skip_tolerance: 0.025
  trim_max_initial_error: 0.35
  skip_reached_point_tolerance: 0.025

  grasp_z_offset: 0.005
  warn_tcp_error: 0.20

  # Duraciones largas para generar 50-80 frames por episodio a 5 Hz.
  durations:
    open: 1.5
    pregrasp: 5.5
    grasp: 5.0
    close: 2.8
    lift: 5.0
    preplace: 6.0
    place: 5.0
    release: 2.5
    retreat: 5.0
