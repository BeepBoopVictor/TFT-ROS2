dataset:
  root_dir: "/root/tfg_panda_ws/datasets/fp3_pick_place_v6_act_quality"
  sample_hz: 5.0
  image_format: "png"

camera:
  rgb_topic: "/camera_cabinet/image"
  camera_name: "camera_cabinet"
  cameras:
    cabinet:
      rgb_topic: "/camera_cabinet/image"
      camera_name: "camera_cabinet"
    top:
      rgb_topic: "/camera_top_conveyor/image"
      camera_name: "camera_top_conveyor"

gazebo:
  world_name: "fp3_pick_place_world"
  red_cube_entity: "red_cube"
  blue_cube_entity: "blue_cube"
  hidden_xyz: [2.0, 2.0, 0.50]
  settle_after_reset_sec: 1.5

robot:
  planning_frame: "world"
  tcp_frame: "fp3_hand_tcp"
  arm_joints:
    - fp3_joint1
    - fp3_joint2
    - fp3_joint3
    - fp3_joint4
    - fp3_joint5
    - fp3_joint6
    - fp3_joint7
  gripper_joints:
    - fp3_finger_joint1
    - fp3_finger_joint2
  grasp_down_quat:
    qx: 1.0
    qy: 0.0
    qz: 0.0
    qw: 0.0

gripper:
  open_width: 0.039
  grasp_width: 0.010
  safe_min_width: 0.003
  command_duration: 2.8
  position_tolerance: 0.004

scene:
  conveyor_length: 2.80
  red_cube:
    color: "red"
    default_pick_xyz: [0.40, 0.18, 0.23]
    goal_xyz: [0.05, 0.55, 0.23]
  blue_cube:
    color: "blue"
    default_pick_xyz: [0.40, -0.18, 0.23]
    goal_xyz: [0.05, -0.55, 0.23]

randomization:
  enabled: true
  # V6 de calidad: rango moderado para que ACT aprenda rollout estable primero.
  conveyor_spawn:
    x_min: 0.34
    x_max: 0.48
    y_min: 0.12
    y_max: 0.22
    z: 0.24
  probability_two_cubes: 0.10
  min_cube_distance_xy: 0.26

motion:
  pregrasp_z: 0.43
  lift_z: 0.52
  preplace_z: 0.43
  retreat_z: 0.52
  settle_after_motion_sec: 0.8
  settle_after_gripper_sec: 1.2
  move_retries: 2
  move_timeout_sec: 120.0

# IMPORTANTE: record_pick_place_episode_moveit_tcp.py lee exactamente esta clave: moveit_tcp.durations.
moveit_tcp:
  durations:
    pregrasp: 5.5
    down: 5.0
    lift: 5.0
    transfer: 6.0
    retreat: 5.0

validation:
  enabled: true
  require_pose_query: true
  goal_area:
    enabled: true
    red:
      center_xyz: [0.05, 0.55, 0.23]
      size_xy: [0.36, 0.36]
    blue:
      center_xyz: [0.05, -0.55, 0.23]
      size_xy: [0.36, 0.36]
    margin_xy: 0.04
  goal_tolerance_xy: 0.25
  goal_tolerance_z: 0.25

recording:
  keep_failed_episodes: true
