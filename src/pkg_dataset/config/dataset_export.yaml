dataset:
  root_dir: "/root/tfg_panda_ws/datasets/fp3_pick_place_v3"
  episodes_dir_name: "episodes"

  manifest_filename: "manifest.csv"
  report_json_filename: "dataset_report.json"
  report_csv_filename: "dataset_report.csv"

  splits_dir_name: "splits"
  train_filename: "train.csv"
  val_filename: "val.csv"
  test_filename: "test.csv"

  exported_dir_name: "exported_lerobot_like"

filtering:
  # Para entrenar imitation learning normalmente usaremos solo success=true.
  only_success: true

  # Si un episodio tiene menos imágenes que esto, se considera sospechoso.
  min_steps_per_episode: 5

  # Si está activo, ignora episodios sin CSV o sin metadata.
  skip_incomplete: true

splits:
  seed: 42
  train_ratio: 0.80
  val_ratio: 0.10
  test_ratio: 0.10

actions:
  # Formato de acción inicial recomendado:
  # [target_x, target_y, target_z, gripper_width]
  use_compact_action: true

  fixed_orientation:
    qx: 1.0
    qy: 0.0
    qz: 0.0
    qw: 0.0

columns:
  episode_id: "episode_id"
  step: "step"
  success: "success"
  failure_reason: "failure_reason"
  object_color: "object_color"
  phase: "phase"
  image_path: "image_path"

robot:
  arm_joints:
    - fp3_joint1
    - fp3_joint2
    - fp3_joint3
    - fp3_joint4
    - fp3_joint5
    - fp3_joint6
    - fp3_joint7

  gripper_joints:
    - fp3_finger_joint1
    - fp3_finger_joint2